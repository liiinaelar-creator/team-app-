<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المجموعة C</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #040917;
  --bg-grad: radial-gradient(circle at 82% 0%, #1b3882 0%, #0a1638 45%, #040814 100%);
  --glass: linear-gradient(145deg, rgba(22, 42, 88, 0.46) 0%, rgba(11, 22, 52, 0.34) 100%);
  --glass-strong: linear-gradient(145deg, rgba(24, 46, 96, 0.62) 0%, rgba(12, 24, 56, 0.52) 100%);
  --glass-border: rgba(125, 185, 255, 0.32);
  --glass-highlight: rgba(255, 255, 255, 0.22);
  --blue-glow: linear-gradient(135deg, #2589ff 0%, #0052d4 100%);
  --green-card: linear-gradient(160deg, rgba(16, 145, 85, 0.62) 0%, rgba(10, 60, 40, 0.72) 70%, rgba(16, 185, 129, 0.85) 120%);
  --red-card: linear-gradient(160deg, rgba(175, 38, 60, 0.62) 0%, rgba(75, 18, 30, 0.72) 70%, rgba(239, 68, 68, 0.85) 120%);
  --orange-card: linear-gradient(160deg, rgba(185, 110, 18, 0.62) 0%, rgba(75, 45, 10, 0.72) 70%, rgba(245, 158, 11, 0.85) 120%);
  --purple-card: linear-gradient(160deg, rgba(105, 55, 195, 0.62) 0%, rgba(45, 22, 90, 0.72) 70%, rgba(139, 92, 246, 0.85) 120%);
  --tx: #ffffff;
  --mu: #a3b8df;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg-deep);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--tx);
  font-family: 'Cairo', system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  padding-bottom: 82px;
  position: relative;
}

/* إضاءة خلفية زجاجية ناعمة لتعزيز تأثير الـ Glassmorphism على كامل الصفحات */
body::before,
body::after {
  content: '';
  position: fixed;
  border-radius: 50%;
  filter: blur(85px);
  z-index: -1;
  pointer-events: none;
}
body::before {
  width: 280px;
  height: 280px;
  top: 8%;
  right: -60px;
  background: rgba(56, 189, 248, 0.18);
}
body::after {
  width: 300px;
  height: 300px;
  bottom: 10%;
  left: -70px;
  background: rgba(37, 99, 235, 0.22);
}

body.locked {
  padding-bottom: 24px;
}

/* Gate Screen - Futuristic Chamfered Glass Card with 3D Flip & Corner Accents */
.gate-wrap {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 22px 16px;
  perspective: 1300px;
}
.gate-stage {
  width: 100%;
  max-width: 400px;
  position: relative;
  transform-style: preserve-3d;
  animation: gateCardFlipIn 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.gate-stage.gate-exit {
  animation: gateCardFlipOut 0.72s cubic-bezier(0.55, 0, 0.2, 1) forwards;
}
@keyframes gateCardFlipIn {
  0% {
    opacity: 0;
    transform: perspective(1200px) rotateY(-88deg) scale(0.86);
  }
  45% {
    opacity: 1;
    transform: perspective(1200px) rotateY(10deg) scale(1.01);
  }
  75% {
    transform: perspective(1200px) rotateY(-3deg) scale(1);
  }
  100% {
    opacity: 1;
    transform: perspective(1200px) rotateY(0deg) scale(1);
  }
}
@keyframes gateCardFlipOut {
  0% {
    opacity: 1;
    transform: perspective(1200px) rotateY(0deg) scale(1);
  }
  100% {
    opacity: 0;
    transform: perspective(1200px) rotateY(92deg) scale(0.85);
  }
}

/* طبقة الشعار الزجاجي العابر أثناء الدوران (مثل بداية ونهاية الفيديو) */
.gate-flip-badge {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  z-index: 6;
  animation: badgeFlash 1.05s ease-out forwards;
}
.gate-stage.gate-exit .gate-flip-badge {
  animation: badgeFlashOut 0.72s ease-in forwards;
}
.gate-flip-emblem {
  width: 68px;
  height: 68px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(56, 189, 248, 0.38), rgba(14, 116, 195, 0.25));
  border: 1px solid rgba(147, 215, 255, 0.65);
  box-shadow: 0 0 32px rgba(56, 189, 248, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  display: grid;
  place-items: center;
  position: relative;
  overflow: hidden;
}
.gate-flip-emblem::after {
  content: '';
  position: absolute;
  width: 140%;
  height: 2px;
  background: rgba(186, 230, 253, 0.75);
  transform: rotate(-45deg);
  box-shadow: 0 0 10px #38bdf8;
}
@keyframes badgeFlash {
  0% { opacity: 0.95; transform: scale(1.08); }
  55% { opacity: 0.85; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.75); }
}
@keyframes badgeFlashOut {
  0% { opacity: 0; transform: scale(0.75); }
  45% { opacity: 0.95; transform: scale(1.05); }
  100% { opacity: 0; transform: scale(0.9); }
}

/* الزوايا الزرقاء المضيئة المشطوفة (أعلى اليسار وأسفل اليمين) */
.gate-corner {
  position: absolute;
  width: 34px;
  height: 34px;
  pointer-events: none;
  z-index: 5;
  filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.65));
  animation: cornerPulse 3.4s ease-in-out infinite;
}
.gate-corner.tl {
  top: 6px;
  left: 6px;
  background: linear-gradient(135deg, rgba(125, 211, 252, 0.88) 0%, rgba(14, 165, 233, 0.35) 65%, transparent 100%);
  border: 1px solid rgba(186, 230, 253, 0.75);
  border-radius: 10px 4px 4px 4px;
  clip-path: polygon(0 0, 100% 0, 0 100%);
}
.gate-corner.br {
  bottom: 6px;
  right: 6px;
  background: linear-gradient(315deg, rgba(125, 211, 252, 0.88) 0%, rgba(14, 165, 233, 0.35) 65%, transparent 100%);
  border: 1px solid rgba(186, 230, 253, 0.75);
  border-radius: 4px 4px 10px 4px;
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}
@keyframes cornerPulse {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.05); }
}

/* الإطار الخارجي المضيء للوحة */
.gate-frame {
  padding: 1.5px;
  background: linear-gradient(135deg, rgba(147, 215, 255, 0.65) 0%, rgba(56, 189, 248, 0.16) 45%, rgba(147, 215, 255, 0.58) 100%);
  clip-path: polygon(44px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 44px), calc(100% - 44px) 100%, 18px 100%, 0 calc(100% - 18px), 0 44px);
  box-shadow: 0 26px 65px rgba(0, 0, 0, 0.75);
}

.gate-card {
  width: 100%;
  padding: 34px 24px 28px;
  background:
    radial-gradient(circle at 20% 22%, rgba(14, 165, 233, 0.24) 0%, transparent 52%),
    radial-gradient(circle at 82% 78%, rgba(37, 99, 235, 0.26) 0%, transparent 55%),
    linear-gradient(160deg, rgba(10, 22, 46, 0.84) 0%, rgba(5, 11, 24, 0.92) 100%);
  backdrop-filter: blur(26px) saturate(155%);
  -webkit-backdrop-filter: blur(26px) saturate(155%);
  clip-path: polygon(44px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 44px), calc(100% - 44px) 100%, 18px 100%, 0 calc(100% - 18px), 0 44px);
  position: relative;
  overflow: hidden;
}

/* وميض مسح ضوئي ناعم يعبر البطاقة بعد الفتح */
.gate-card::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -120%;
  width: 80%;
  height: 200%;
  background: linear-gradient(90deg, transparent 0%, rgba(125, 211, 252, 0.14) 50%, transparent 100%);
  transform: rotate(24deg);
  pointer-events: none;
  animation: gateSheen 1.4s 0.45s ease-out forwards;
}
@keyframes gateSheen {
  0% { left: -120%; }
  100% { left: 160%; }
}

.gate-content-anim {
  animation: gateInnerFade 0.65s 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes gateInnerFade {
  0% { opacity: 0; transform: translateY(10px) scale(0.98); filter: blur(4px); }
  100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
}

.gate-head {
  text-align: center;
  margin-bottom: 22px;
}
.gate-head h2 {
  margin: 0;
  font-size: 27px;
  font-weight: 800;
  line-height: 1.25;
  text-shadow: 0 0 18px rgba(56, 189, 248, 0.35);
}
.gate-field {
  margin-bottom: 15px;
}
.gate-lbl-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  color: #bae6fd;
  margin-bottom: 6px;
  padding: 0 2px;
}
.gate-num {
  font-family: monospace;
  font-size: 11px;
  color: #6482b0;
}
.gate-inp {
  width: 100%;
  background: rgba(6, 14, 32, 0.72);
  border: 1px solid rgba(115, 190, 255, 0.32);
  border-radius: 13px;
  padding: 13px 15px;
  color: #ffffff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.42);
}
.gate-inp:focus {
  border-color: #38bdf8;
  background: rgba(9, 22, 48, 0.92);
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22), 0 0 18px rgba(56, 189, 248, 0.2), inset 0 2px 8px rgba(0, 0, 0, 0.35);
}
.gate-inp::placeholder {
  color: #5b76a3;
}
.gate-submit {
  width: 100%;
  margin-top: 10px;
  padding: 13px 18px;
  border-radius: 14px;
  border: 1px solid rgba(186, 230, 253, 0.7);
  background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #7dd3fc 100%);
  color: #030b1a;
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  box-shadow: 0 8px 26px rgba(14, 165, 233, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.75);
  transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
}
.gate-submit:hover {
  filter: brightness(1.06);
  box-shadow: 0 10px 30px rgba(56, 189, 248, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.85);
}
.gate-submit:active {
  transform: scale(0.98);
}

/* Online Presence Bar & Modal */
.online-pill {
  background: rgba(16, 185, 129, 0.18);
  border: 1px solid rgba(74, 222, 128, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: #86efac;
  border-radius: 11px;
  padding: 5px 10px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.online-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 8px #22c55e;
}
.user-badge {
  font-size: 11px;
  color: var(--mu);
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.role-tag {
  font-size: 10px;
  font-weight: 800;
  padding: 1px 7px;
  border-radius: 8px;
  backdrop-filter: blur(8px);
}
.role-tag.admin {
  background: rgba(37, 137, 255, 0.25);
  border: 1px solid rgba(130, 195, 255, 0.5);
  color: #93c5fd;
}
.role-tag.visitor {
  background: rgba(148, 163, 184, 0.18);
  border: 1px solid rgba(148, 163, 184, 0.35);
  color: #cbd5e1;
}

.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 14px 14px 20px;
}

.hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px 12px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3), inset 0 1px 0 var(--glass-highlight);
}
.hdr-right {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.hdr-title h1 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.2; }
.hdr-title p { margin: 1px 0 0; font-size: 11px; color: var(--mu); }

.hdr-left {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex: none;
}

/* البطاقات الزجاجية الشفافة على كامل الصفحات */
.glass-box {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  backdrop-filter: blur(20px) saturate(145%);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 var(--glass-highlight), inset 0 -1px 0 rgba(255, 255, 255, 0.05);
  margin-bottom: 12px;
}

/* الشريط العلوي بنفس تأثير الإضاءة المخروطية (Spotlight) وتصميم الكبسولة الزجاجية */
.top-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: rgba(11, 22, 48, 0.68);
  border: 1px solid rgba(110, 175, 255, 0.34);
  border-radius: 26px;
  backdrop-filter: blur(20px) saturate(145%);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  padding: 5px 6px;
  gap: 2px;
  overflow: hidden;
  margin-bottom: 10px;
  position: relative;
}
.top-tab {
  background: transparent;
  border: 0;
  color: var(--mu);
  font-family: inherit;
  padding: 7px 3px 5px;
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  position: relative;
  transition: color 0.25s ease, transform 0.2s ease;
  z-index: 1;
}
.top-tab svg {
  width: 17px;
  height: 17px;
  position: relative;
  z-index: 2;
  transition: filter 0.25s ease, transform 0.25s ease;
}
.top-tab span {
  position: relative;
  z-index: 2;
}
.top-tab.on {
  color: #ffffff;
  background: transparent;
  box-shadow: none;
}
/* الشريط المضيء العلوي للتبويب النشط في الشريط العلوي */
.top-tab.on::before {
  content: '';
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 4px;
  border-radius: 0 0 6px 6px;
  background: linear-gradient(90deg, #38bdf8, #60a5fa, #38bdf8);
  box-shadow: 0 0 12px #38bdf8, 0 2px 18px #2589ff;
  z-index: 3;
}
/* مخروط الإضاءة المتدرج للتبويب النشط في الشريط العلوي */
.top-tab.on::after {
  content: '';
  position: absolute;
  top: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 52px;
  background: linear-gradient(180deg, rgba(56, 189, 248, 0.42) 0%, rgba(37, 137, 255, 0.16) 58%, rgba(37, 137, 255, 0) 100%);
  clip-path: polygon(28% 0%, 72% 0%, 100% 100%, 0% 100%);
  pointer-events: none;
  z-index: 1;
}
.top-tab.on svg {
  filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.95));
  transform: translateY(-1px);
}
.top-tab.on span {
  text-shadow: 0 0 10px rgba(125, 211, 252, 0.75);
}

.news-bar {
  padding: 6px 10px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  overflow: hidden;
}
.news-badge {
  background: linear-gradient(135deg, #0ea5e9, #2563eb);
  border: 1px solid rgba(147, 197, 253, 0.5);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  box-shadow: 0 0 12px rgba(14, 165, 233, 0.35);
}
.ticker-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  height: 24px;
  display: flex;
  align-items: center;
}
.ticker-track {
  display: inline-block;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 600;
  color: #e2e8f0;
  padding-right: 100%;
  animation: ticker-rtl 18s linear infinite;
}
.news-bar:hover .ticker-track {
  animation-play-state: paused;
}
@keyframes ticker-rtl {
  0% { transform: translateX(0); }
  100% { transform: translateX(100%); }
}
.news-edit-btn {
  background: rgba(37, 137, 255, 0.24);
  border: 1px solid rgba(96, 165, 250, 0.45);
  backdrop-filter: blur(10px);
  color: #93c5fd;
  border-radius: 9px;
  padding: 4px 8px;
  font-family: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  flex: none;
}

.glow-btn {
  background: var(--blue-glow);
  border: 1px solid rgba(150, 205, 255, 0.5);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(37, 137, 255, 0.4), inset 0 1px 0 rgba(255,255,255,0.3);
}
.glow-btn.sm {
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 11px;
  gap: 5px;
}
.glow-btn.danger {
  background: linear-gradient(135deg, #dc2626, #991b1b);
  border-color: rgba(252, 165, 165, 0.45);
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
}

.stats-wrap { padding: 8px 10px; margin-bottom: 10px; }
.filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.pill-input {
  background: rgba(12, 26, 60, 0.48);
  border: 1px solid rgba(120, 180, 255, 0.3);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 11px;
  padding: 4px 8px;
  color: #fff;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
}
.pill-input input, .pill-input select {
  background: transparent; border: 0; color: #fff; font-family: inherit;
  font-size: 11px; font-weight: 700; width: 100%; outline: none; color-scheme: dark;
}
.pill-input select option { background: #0c1733; color: #fff; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat-card {
  border-radius: 13px;
  padding: 5px 3px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.28);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.25);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 54px;
}
.stat-card svg { width: 15px; height: 15px; }
.stat-card.g { background: var(--green-card); border-color: rgba(74, 222, 128, 0.55); }
.stat-card.r { background: var(--red-card); border-color: rgba(248, 113, 113, 0.55); }
.stat-card.o { background: var(--orange-card); border-color: rgba(251, 191, 36, 0.55); }
.stat-card.p { background: var(--purple-card); border-color: rgba(167, 139, 250, 0.55); }
.stat-num { font-size: 15px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
.stat-lbl { font-size: 9.5px; font-weight: 600; line-height: 1.1; margin-top: 2px; }

.list-wrap { padding: 12px; }
.list-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.list-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
.search-row { display: flex; gap: 8px; margin-bottom: 10px; }
.search-box {
  flex: 1;
  background: rgba(12, 26, 60, 0.48);
  border: 1px solid rgba(120, 180, 255, 0.3);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-radius: 13px;
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
}
.search-box input {
  background: transparent; border: 0; color: #fff; font-family: inherit;
  font-size: 13px; width: 100%; outline: none;
}
.search-box input::placeholder { color: var(--mu); }
.filter-sq {
  width: 40px;
  height: 38px;
  border-radius: 13px;
  background: rgba(18, 36, 78, 0.55);

/* الشريط السفلي بتأثير الإضاءة المخروطية (Spotlight) وتصميم الكبسولة الزجاجية */

  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.18);

.bot-btn {
  background: transparent;
  border: 0;
  color: var(--mu);
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
  padding: 7px 2px 5px;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  position: relative;
  transition: color 0.25s ease, transform 0.2s ease;
  z-index: 1;
}
.bot-btn svg {
  width: 19px;
  height: 19px;
  position: relative;
  z-index: 2;
  transition: filter 0.25s ease, transform 0.25s ease;
}
.bot-btn span {
  position: relative;
  z-index: 2;
}
.bot-btn.on {
  color: #ffffff;
  background: transparent;
  box-shadow: none;
}
/* الشريط المضيء العلوي (Spotlight Bar) */
.bot-btn.on::before {
  content: '';
  position: absolute;
  top: -5px;
  left: 50%;
  transform: translateX(-50%);
  width: 30px;
  height: 4px;
  border-radius: 0 0 6px 6px;
  background: linear-gradient(90deg, #38bdf8, #60a5fa, #38bdf8);
  box-shadow: 0 0 12px #38bdf8, 0 2px 18px #2589ff;
  z-index: 3;
}
/* مخروط الإضاءة المتدرج (Spotlight Cone) */
.bot-btn.on::after {
  content: '';
  position: absolute;
  top: -4px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px;
  height: 54px;
  background: linear-gradient(180deg, rgba(56, 189, 248, 0.42) 0%, rgba(37, 137, 255, 0.16) 58%, rgba(37, 137, 255, 0) 100%);
  clip-path: polygon(28% 0%, 72% 0%, 100% 100%, 0% 100%);
  pointer-events: none;
  z-index: 1;
}
.bot-btn.on svg {
  filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.95));
  transform: translateY(-1px);
}

  text-shadow: 0 0 10px rgba(125, 211, 252, 0.75);

function yrOf(d){
  return (d && String(d).length >= 4) ? String(d).slice(0, 4) : String(new Date().getFullYear());

// تطبيع البيانات وضمان حفظ التعيينات حسب السنة
function normalizePerson(p){
  if(p.loc === 'A') p.loc = 'T1';
  else if(p.loc === 'B') p.loc = 'T2';
  if(p.loc && !LOC_ZONES[p.loc]) p.loc = '';
  if(p.loc && (!p.sub || !LOC_ZONES[p.loc].includes(p.sub))){
    p.sub = LOC_ZONES[p.loc][0];
  }
  if(!p.loc) p.sub = '';
  return p;
}

function normalizeState(st){
  st.duty = st.duty || [];
  st.notes = st.notes || [];
  st.visitorName = st.visitorName || '';
  if(typeof st.news !== 'string') st.news = 'مرحباً بكم في لوحة تسيير الفريق.';
  (st.people || []).forEach(normalizePerson);

  if(!st.assignByYear || typeof st.assignByYear !== 'object'){
    st.assignByYear = {};
    var baseYr = '2026';
    st.assignByYear[baseYr] = {};
    (st.people || []).forEach(p => {
      if(p.loc){
        st.assignByYear[baseYr][p.id] = { loc: p.loc, sub: p.sub || LOC_ZONES[p.loc][0] };
      }
    });
  }
  return st;
}

function getAssign(pid, d){
  var y = yrOf(d || date);
  var ym = (S.assignByYear && S.assignByYear[y]) ? S.assignByYear[y] : {};
  var rec = ym[pid];
  if(rec && rec.loc && LOC_ZONES[rec.loc]){
    var sub = (rec.sub && LOC_ZONES[rec.loc].includes(rec.sub)) ? rec.sub : LOC_ZONES[rec.loc][0];
    return { loc: rec.loc, sub: sub };
  }
  return { loc: '', sub: '' };
}

function setAssign(pid, d, loc, sub){
  var y = yrOf(d || date);
  S.assignByYear = S.assignByYear || {};
  S.assignByYear[y] = S.assignByYear[y] || {};
  if(!loc || !LOC_ZONES[loc]){
    delete S.assignByYear[y][pid];
  } else {
    var validSub = (sub && LOC_ZONES[loc].includes(sub)) ? sub : LOC_ZONES[loc][0];
    S.assignByYear[y][pid] = { loc: loc, sub: validSub };
  }
  if(y === yrOf(td())){
    var p = S.people.find(x => x.id == pid);
    if(p){
      p.loc = loc || '';
      p.sub = (loc && LOC_ZONES[loc]) ? ((sub && LOC_ZONES[loc].includes(sub)) ? sub : LOC_ZONES[loc][0]) : '';
    }
  }
}

function td(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function def(){

    var sub = zones[(i-1)%zones.length];
    p.push({id:i, name:'موظف '+i, loc:loc, sub:sub});
    assign[i] = { loc: loc, sub: sub };
  }
  var aby = {}; aby[y] = assign;

}

function isAdminUser(user){
  if(!user || !user.email) return false;
  var em = user.email.trim().toLowerCase();
  return ADMIN_EMAILS.map(x => x.trim().toLowerCase()).includes(em);
}

function startPresence(user){
  stopPresence();
  if(!user || !user.uid) return;
  var safeKey = user.uid;
  var myPresRef = ref(rtdb, `presence/${safeKey}`);
  var connectedRef = ref(rtdb, ".info/connected");

  onValue(connectedRef, (snap) => {
    if (snap.val() === true && auth.currentUser && auth.currentUser.uid === safeKey) {
      onDisconnect(myPresRef).update({
        online: false,
        lastSeen: serverTimestamp()
      }).catch(() => {});
      set(myPresRef, {
        uid: user.uid,
        email: user.email || '',
        role: isAdminUser(user) ? 'admin' : 'visitor',
        online: true,
        joinedAt: Date.now(),
        lastSeen: Date.now(),
        ts: serverTimestamp()
      }).catch(() => {});
    }
  });

  if(isAdminUser(user)){
    var allPresRef = ref(rtdb, "presence");
    unsubscribePresence = onValue(allPresRef, (snap) => {
      var val = snap.val() || {};
      var arr = Object.values(val).filter(u => u && (u.email || u.uid));
      arr.sort((a, b) => {
        if (!!a.online !== !!b.online) return a.online ? -1 : 1;
        var ta = a.online ? (a.joinedAt || 0) : (a.lastSeen || a.joinedAt || 0);
        var tb = b.online ? (b.joinedAt || 0) : (b.lastSeen || b.joinedAt || 0);
        return tb - ta;
      });
      ALL_PRESENCE_USERS = arr;
      ONLINE_USERS = arr.filter(u => u.online);
      renderAuth();
      renderOnlineModal();
    });
  }
}

function stopPresence(){
  if(unsubscribePresence){
    unsubscribePresence();
    unsubscribePresence = null;
  }
  ONLINE_USERS = [];
  ALL_PRESENCE_USERS = [];
}

function startDataSync(){
  if(unsubscribeData){
    unsubscribeData();
    unsubscribeData = null;
  }
  unsubscribeData = onSnapshot(docRef, (snap) => {
    if (snap.exists()) {
      S = normalizeState(snap.data());
      render();
    } else if (OWN) {
      save();
    }
  }, (err) => {
    console.error("Firestore sync error:", err);
  });
}

const SESSION_MAX_MS = 2 * 60 * 60 * 1000; // ساعتان (7,200,000 مللي ثانية)
var sessionExpiryTimer = null;

function clearSessionTimer(){
  if(sessionExpiryTimer){
    clearTimeout(sessionExpiryTimer);
    sessionExpiryTimer = null;
  }
}

async function expireSessionAndLogout(){
  clearSessionTimer();
  try { localStorage.removeItem('group_c_login_ts'); } catch(e){}
  if(CURRENT_USER && CURRENT_USER.uid){
    try {
      await update(ref(rtdb, `presence/${CURRENT_USER.uid}`), {
        online: false,
        lastSeen: Date.now()
      });
    } catch(e){}
  }
  await signOut(auth);
  var errEl = $('gate-err');
  if(errEl) errEl.textContent = 'انتهت مدة الجلسة (ساعتان) لأسباب أمنية، يرجى إعادة تسجيل الدخول.';
}

function scheduleSessionExpiry(user){
  clearSessionTimer();
  var now = Date.now();
  var savedTs = 0;
  try { savedTs = Number(localStorage.getItem('group_c_login_ts') || 0); } catch(e){}
  var authTimeMs = (user && user.metadata && user.metadata.lastSignInTime)
    ? new Date(user.metadata.lastSignInTime).getTime()
    : 0;
  var loginStart = savedTs || authTimeMs || now;
  if(!savedTs){
    try { localStorage.setItem('group_c_login_ts', String(loginStart)); } catch(e){}
  }
  var elapsed = now - loginStart;
  if(elapsed >= SESSION_MAX_MS){
    expireSessionAndLogout();
    return false;
  }
  var remaining = SESSION_MAX_MS - elapsed;
  sessionExpiryTimer = setTimeout(() => {
    expireSessionAndLogout();
  }, remaining);
  return true;
}

// فحص دوري كل 30 ثانية لضمان الخروج التلقائي حتى لو دخل الهاتف في وضع السكون
setInterval(() => {
  if(LOGGED_IN && CURRENT_USER){
    var savedTs = 0;
    try { savedTs = Number(localStorage.getItem('group_c_login_ts') || 0); } catch(e){}
    if(savedTs && (Date.now() - savedTs >= SESSION_MAX_MS)){
      expireSessionAndLogout();
    }
  }
}, 30000);

onAuthStateChanged(auth, async (user) => {
  if (user) {
    if(!scheduleSessionExpiry(user)) return;
    CURRENT_USER = user;
    LOGGED_IN = true;
    OWN = isAdminUser(user);
    var stage = $('gate-stage');
    if (stage && document.body.classList.contains("locked")) {
      stage.classList.add("gate-exit");
      await new Promise(r => setTimeout(r, 620));
    }
    document.body.classList.remove("locked");
    if (stage) stage.classList.remove("gate-exit");
    startDataSync();
    startPresence(user);
    render();
  } else {
    clearSessionTimer();
    try { localStorage.removeItem('group_c_login_ts'); } catch(e){}
    if(CURRENT_USER && CURRENT_USER.uid){
      try {
        await update(ref(rtdb, `presence/${CURRENT_USER.uid}`), {
          online: false,
          lastSeen: Date.now()
        });
      } catch(e){}
    }
    stopPresence();
    if(unsubscribeData){ unsubscribeData(); unsubscribeData = null; }
    CURRENT_USER = null;
    LOGGED_IN = false;
    OWN = false;
    var stage = $('gate-stage');
    if (stage) {
      stage.classList.remove("gate-exit");
      stage.style.animation = 'none';
      void stage.offsetWidth;
      stage.style.animation = '';
    }
    document.body.classList.add("locked");
    closeAddModal();
    closeEditModal();
    closeNewsModal();
    closeOnlineModal();
    closeProfileModal();
    closeSwapModal();
  }
});

function formatPresenceTime(ms){
  if(!ms || typeof ms !== 'number') return 'غير معروف';
  return formatNoteDateTime(new Date(ms).toISOString());
}
function renderOnlineModal(){
  var body = $('online-list-body');
  if(!body) return;
  if(!ALL_PRESENCE_USERS.length){
    body.innerHTML = '<div class="sub-txt" style="text-align:center;padding:14px">لا يوجد سجل اتصال بعد</div>';
    return;
  }
  body.innerHTML = ALL_PRESENCE_USERS.map(u => {
    var isOnline = !!u.online;
    var isAdm = u.role === 'admin';
    var statusTxt = isOnline
      ? `<span style="color:#86efac;font-weight:700">متصل الآن</span> · دخل: ${esc(formatPresenceTime(u.joinedAt))}`
      : `<span style="color:#94a3b8">آخر ظهور:</span> <b style="color:#cbd5e1">${esc(formatPresenceTime(u.lastSeen || u.joinedAt))}</b>`;
    return `<div class="worker-item">
      <div style="min-width:0">
        <div class="w-name" style="word-break:break-all;display:flex;align-items:center;gap:6px">
          <span class="${isOnline ? 'online-dot' : 'offline-dot'}"></span>
          <span>${esc(u.email || 'مستخدم')}</span>
        </div>
        <div class="sub-txt" style="margin-top:2px">${statusTxt}</div>
      </div>
      <span class="role-tag ${isAdm ? 'admin' : 'visitor'}">${isAdm ? 'مشرف' : 'زائر'}</span>
    </div>`;
  }).join('');
}

};

window.openNewsModal = function(){
  if(!OWN) return;
  $('news-inp').value = S.news || '';
  $('news-modal').style.display = 'grid';
  setTimeout(() => $('news-inp').focus(), 50);
};
window.closeNewsModal = function(){
  var m = $('news-modal');
  if(m) m.style.display = 'none';
};
window.saveNews = function(){
  if(!OWN) return;
  S.news = $('news-inp').value.trim();
  closeNewsModal();
  renderNews();
  save();
};

function render(){
  document.body.className = OWN ? '' : 'ro';
  $('top-tabs').innerHTML = TOP_TABS.map(t =>
    `<button class="top-tab ${botTab==='home' && topTab===t.id ? 'on' : ''}" onclick="setTop('${t.id}')">${t.icon}<span>${t.label}</span></button>`
  ).join('');

  var unreadCount = getUnreadNotesCount();
  $('bot-nav').innerHTML = BOT_TABS.map(t => {
    var badgeHtml = (t.id === 'notes' && OWN && unreadCount > 0)
      ? `<span class="nav-badge">${unreadCount > 99 ? '99+' : unreadCount}</span>`
      : '';
    return `<button class="bot-btn ${botTab===t.id ? 'on' : ''}" onclick="setSub('${t.id}')">${badgeHtml}${t.icon}<span>${t.label}</span></button>`;
  }).join('');

  renderAuth();
  renderNews();

  var main = $('main-view');
  if(botTab === 'notes') main.innerHTML = viewNotes();
  else if(botTab === 'stats') main.innerHTML = viewStats();
  else if(botTab === 'duty') main.innerHTML = viewDuty();
  else main.innerHTML = (topTab === 'att') ? viewAtt() : viewLeave(topTab);
}

function renderNews(){
  var txt = (S.news || '').trim();
  if(!txt && !OWN){
    $('news-ticker-box').innerHTML = '';
    return;
  }
  var displayTxt = txt || 'لا يوجد خبر منشور حالياً (اضغط تعديل لإضافة إعلان)';
  var speakerIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
  var dur = Math.max(12, Math.min(35, Math.round(displayTxt.length * 0.28)));

  $('news-ticker-box').innerHTML = `
    <div class="glass-box news-bar">
      <span class="news-badge">${speakerIcon}<span>أخبار</span></span>
      <div class="ticker-wrap">
        <div class="ticker-track" style="animation-duration:${dur}s">${esc(displayTxt)}</div>
      </div>
      <button class="news-edit-btn adm" onclick="openNewsModal()">تعديل</button>
    </div>
  `;
}

function isUnavailable(pid, d){
  return !!stFor(pid, d);
}

function getFilteredPeople(){
  return S.people.filter(p => {
    if(isUnavailable(p.id, date)) return false;
    var asg = getAssign(p.id, date);
    var matchLoc = (flt === 'all' || asg.loc === flt);
    var matchSub = (fltSub === 'all' || asg.sub === fltSub);
    return matchLoc && matchSub;
  });
}

function viewAtt(){
  var ppl = getFilteredPeople();
  var a = S.att[date] || {}, pr = 0, ab = 0;
  ppl.forEach(p => {
    if(a[p.id] === 'P') pr++;
    else if(a[p.id] === 'A') ab++;
  });
  var lv = S.people.filter(p => {
    var asg = getAssign(p.id, date);
    return (flt === 'all' || asg.loc === flt) && (fltSub === 'all' || asg.sub === fltSub) && isUnavailable(p.id, date);
  }).length;
  var un = ppl.length - pr - ab;

  // خيارات النقاط الداخلية المتاحة حسب المكان المختار
  var availableZones = (flt === 'all')
    ? ['PIF', 'EDS', 'SOUTE', 'DOMESTIQUE', 'DIPLOMATE']
    : LOC_ZONES[flt];

  return `
  ${renderSmartAlerts()}
  <div class="glass-box stats-wrap">
    <div class="filter-row" style="grid-template-columns: 1.15fr 0.9fr 0.95fr; gap: 5px;">
      <div class="pill-input" style="padding: 4px 6px;">
        <input type="date" value="${date}" onchange="setDate(this.value)">
      </div>
      <div class="pill-input" style="padding: 4px 6px;">
        <select onchange="setFlt(this.value)">
          <option value="all" ${flt==='all'?'selected':''}>الكل (${S.people.length})</option>
          <option value="T1" ${flt==='T1'?'selected':''}>T1 (${S.people.filter(x=>getAssign(x.id,date).loc==='T1').length})</option>
          <option value="T2" ${flt==='T2'?'selected':''}>T2 (${S.people.filter(x=>getAssign(x.id,date).loc==='T2').length})</option>
          <option value="T3" ${flt==='T3'?'selected':''}>T3 (${S.people.filter(x=>getAssign(x.id,date).loc==='T3').length})</option>
        </select>
      </div>
      <div class="pill-input" style="padding: 5px 7px;">
        <select onchange="setFltSub(this.value)">
          <option value="all" ${fltSub==='all'?'selected':''}>كل النقاط</option>
          ${availableZones.map(z => `<option value="${z}" ${fltSub===z?'selected':''}>${z}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card g">
        <div class="stat-num">${pr}</div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h11.09a5.97 5.97 0 0 1-.09-1c0-1.66.68-3.16 1.77-4.24C15.39 14.28 13.56 14 12 14zm7.5 1.5L17 18l-1.5-1.5-1.06 1.06L17 20.12l3.56-3.56-1.06-1.06z"/></svg>
        <div class="stat-lbl">حاضر</div>
      </div>
      <div class="stat-card r">
        <div class="stat-num">${ab}</div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h11.09a5.97 5.97 0 0 1-.09-1c0-1.66.68-3.16 1.77-4.24C15.39 14.28 13.56 14 12 14zm8.5 1.56L19.44 14.5 18 15.94l-1.44-1.44-1.06 1.06L16.94 17l-1.44 1.44 1.06 1.06L18 18.06l1.44 1.44 1.06-1.06L19.06 17l1.44-1.44z"/></svg>
        <div class="stat-lbl">غائب</div>
      </div>
      <div class="stat-card o">
        <div class="stat-num">${lv}</div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><circle cx="15" cy="17" r="2.5"/></svg>
        <div class="stat-lbl">شهادة / عطلة / رخصة</div>
      </div>
      <div class="stat-card p">
        <div class="stat-num">${un}</div>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="12" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="15.5" cy="12" r="1" fill="currentColor"/></svg>
        <div class="stat-lbl">غير محدد</div>
      </div>
    </div>

    <div class="adm" style="margin-top:8px;text-align:center">
      <button class="glow-btn sm" style="width:100%;justify-content:center;padding:7px" onclick="allP()">تعيين الباقي حاضراً</button>
    </div>
  </div>

  <div class="glass-box list-wrap">
    <div class="list-hdr">
      <div class="list-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#38bdf8"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span>قائمة الموظفين (${ppl.length})</span>
      </div>
      <div style="display:flex;gap:6px;align-items:center" class="adm">
        <button class="glow-btn sm" style="background:linear-gradient(135deg,#0ea5e9,#0284c7)" onclick="openSwapModal('loc')">⇄ تبديل</button>
        <button class="glow-btn sm" onclick="openAddModal()">+ إضافة موظف</button>
      </div>
    </div>
    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a9d1" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" value="${esc(q)}" oninput="setSearch(this.value)" placeholder="البحث عن موظف...">
      </div>
      <button class="filter-sq" onclick="cycleFlt()" title="تبديل مكان العمل (T1 / T2 / T3)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18l-7 8v6l-4 2v-8L3 4z"/></svg>
      </button>
    </div>
    <div id="workers-container">${renderWorkersRows()}</div>
  </div>`;
}

function renderWorkersRows(){
  var ppl = getFilteredPeople().filter(p => !q || p.name.includes(q.trim()));
  var a = S.att[date] || {};
  if(!ppl.length) return '<div style="text-align:center;color:var(--mu);padding:14px;font-size:13px">لا توجد نتائج مطابقة</div>';

  return ppl.map(p => {
    var s = stFor(p.id, date);
    var rightHtml = '';
    if(s){
      rightHtml = `<span class="st-pill ${CFG[s].cls}">${CFG[s].lb}</span>`;
    } else {
      var v = a[p.id];
      if(!OWN){
        if(v === 'P') rightHtml = `<span class="st-pill p">حاضر ✓</span>`;
        else if(v === 'A') rightHtml = `<span class="st-pill a">غائب ✕</span>`;
        else rightHtml = `<span class="st-pill none">غير محدد</span>`;
      } else {
        rightHtml = `<div class="adm-seg">
          <button class="p ${v==='P'?'on':''}" onclick="setA(${p.id},'P')">حاضر ✓</button>
          <button class="a ${v==='A'?'on':''}" onclick="setA(${p.id},'A')">غائب ✕</button>
        </div>`;
      }
    }
    var curAsg = getAssign(p.id, date);
    var zones = curAsg.loc ? (LOC_ZONES[curAsg.loc] || []) : [];
    var locHtml = !OWN
      ? `<span class="w-loc">${curAsg.loc ? (esc(curAsg.loc) + ' · ' + esc(curAsg.sub)) : 'غير معين'}</span>`
      : `<div class="w-loc-edit">
          <select class="mini-sel" onchange="changeWorkerLoc(${p.id}, this.value)" title="تعيين مكان العمل">
            <option value="" ${!curAsg.loc?'selected':''}>غير معين</option>
            <option value="T1" ${curAsg.loc==='T1'?'selected':''}>T1</option>
            <option value="T2" ${curAsg.loc==='T2'?'selected':''}>T2</option>
            <option value="T3" ${curAsg.loc==='T3'?'selected':''}>T3</option>
          </select>
          ${curAsg.loc ? `<select class="mini-sel" onchange="changeWorkerSub(${p.id}, this.value)" title="تعيين نقطة العمل الداخلية">
            ${zones.map(z => `<option value="${z}" ${curAsg.sub===z?'selected':''}>${z}</option>`).join('')}
          </select>` : ''}
          <button class="edit-icon-btn" onclick="openEditModal(${p.id})" title="تعديل الاسم أو حذف الموظف">تعديل</button>
        </div>`;

    return `<div class="worker-item">
      <div class="w-info">
        <div class="avatar w-clickable" onclick="openProfileModal(${p.id})" title="عرض ملف وسجل الموظف"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
        <div>
          <div class="w-name w-clickable" onclick="openProfileModal(${p.id})" title="عرض ملف وسجل الموظف">${esc(p.name)}</div>
          ${locHtml}
        </div>
      </div>
      ${rightHtml}
    </div>`;
  }).join('');
}

window.renderListOnly = function(){
  var el = $('workers-container');
  if(el) el.innerHTML = renderWorkersRows();
};

window.changeWorkerLoc = function(id, newLoc){
  if(!OWN) return;
  var p = S.people.find(x => x.id == id);
  if(!p) return;
  if(!newLoc){
    setAssign(id, date, '', '');
  } else if(LOC_ZONES[newLoc]){
    var cur = getAssign(id, date);
    var sub = (cur.sub && LOC_ZONES[newLoc].includes(cur.sub)) ? cur.sub : LOC_ZONES[newLoc][0];
    setAssign(id, date, newLoc, sub);
  }
  render(); save();
};

window.changeWorkerSub = function(id, newSub){
  if(!OWN) return;
  var cur = getAssign(id, date);
  if(!cur.loc) return;
  setAssign(id, date, cur.loc, newSub);
  render(); save();
};

window.openEditModal = function(id){
  if(!OWN) return;
  var p = S.people.find(x => x.id == id);
  if(!p) return;
  var cur = getAssign(id, date);
  $('e-id').value = p.id;
  $('e-name').value = p.name;
  $('e-loc').value = cur.loc || 'T1';
  syncSubLoc('e-loc', 'e-sub');
  if(cur.sub) $('e-sub').value = cur.sub;
  $('edit-modal').style.display = 'grid';
};

window.closeEditModal = function(){
  var m = $('edit-modal');
  if(m) m.style.display = 'none';
};

window.saveEditWorker = function(){
  if(!OWN) return;
  var id = $('e-id').value;
  var p = S.people.find(x => x.id == id);
  if(!p) return;
  var n = $('e-name').value.trim();
  if(!n){ alert('يرجى كتابة اسم الموظف'); return; }
  p.name = n;
  setAssign(id, date, $('e-loc').value, $('e-sub').value);
  closeEditModal();
  render(); save();
};

window.deleteEditWorker = async function(){
  if(!OWN) return;
  var id = $('e-id').value;
  var p = S.people.find(x => x.id == id);
  var name = p ? p.name : 'هذا الموظف';
  var ok = await showCustomConfirm('حذف الموظف', 'هل أنت متأكد من حذف «' + name + '» وجميع سجلاته نهائياً؟', 'نعم، حذف');
  if(!ok) return;
  S.people = S.people.filter(x => x.id != id);
  ['sick', 'leave', 'exc', 'duty'].forEach(k => {
    S[k] = (S[k] || []).filter(e => e.pid != id);
  });
  Object.keys(S.att).forEach(d => {
    if(S.att[d] && S.att[d][id]) delete S.att[d][id];
  });
  if(S.assignByYear){
    Object.keys(S.assignByYear).forEach(y => {
      if(S.assignByYear[y] && S.assignByYear[y][id]) delete S.assignByYear[y][id];
    });
  }
  closeEditModal();
  render(); save();
};

window.setA = function(id, v){
  if(!OWN) return;
  S.att[date] = S.att[date] || {};
  S.att[date][id] = S.att[date][id] === v ? undefined : v;
  if(!S.att[date][id]) delete S.att[date][id];
  render(); save();
};

window.allP = function(){
  if(!OWN) return;
  S.att[date] = S.att[date] || {};
  getFilteredPeople().forEach(p => {
    if(!stFor(p.id, date) && !S.att[date][p.id]) S.att[date][p.id] = 'P';
  });
  render(); save();
};

function viewLeave(k){
  var c = CFG[k];
  var activeYr = yrOf(date);
  var yrRecords = (S[k] || []).filter(e => yrOf(e.from) === activeYr || yrOf(e.to) === activeYr);
  var opts = S.people.map(p => `<option value="${p.id}">${esc(p.name)} (${ploc(p.id, date)})</option>`).join('');
  var list = yrRecords.slice().sort((a,b) => a.from < b.from ? 1 : -1).map(e => `
    <div class="worker-item">
      <div>
        <div class="w-name">${esc(pn(e.pid))} <span class="w-loc">${esc(ploc(e.pid, e.from))}</span></div>
        <div class="sub-txt" style="margin-top:3px">${e.from} ← ${e.to} · ${days(e.from, e.to)} يوم ${e.note ? '· ' + esc(e.note) : ''}</div>
      </div>
      <button class="del-btn adm" onclick="delE('${k}', ${e.id})">حذف</button>
    </div>`).join('') || '<div style="color:var(--mu);font-size:13px;text-align:center;padding:12px">لا توجد سجلات لسنة ' + activeYr + '</div>';

  return `
  <div class="glass-box list-wrap adm">
    <div class="list-title" style="margin-bottom:10px">إضافة: ${c.t}</div>
    <select id="fp" class="form-inp">${opts}</select>
    <div class="form-row">
      <div style="flex:1"><label class="sub-txt">من تاريخ</label><input type="date" id="ff" class="form-inp" value="${date}"></div>
      <div style="flex:1"><label class="sub-txt">إلى تاريخ</label><input type="date" id="ft" class="form-inp" value="${date}"></div>
    </div>
    <input id="fn" class="form-inp" placeholder="${c.n}">
    <button class="glow-btn" style="width:100%;justify-content:center" onclick="addE('${k}')">حفظ وإضافة</button>
  </div>
  <div class="glass-box list-wrap">
    <div class="list-hdr" style="margin-bottom:10px">
      <div class="list-title" style="margin:0">${c.t} (${yrRecords.length})</div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="glow-btn sm adm" style="background:linear-gradient(135deg,#0ea5e9,#0284c7)" onclick="openSwapModal('duty')">⇄ تبديل</button>
        <div class="pill-input" style="width:auto;padding:4px 8px">
          <input type="date" value="${date}" onchange="setDate(this.value)">
        </div>
      </div>
    </div>
    ${list}
  </div>`;
}

window.addE = function(k){
  if(!OWN) return;
  var f = $('ff').value, t = $('ft').value;
  if(!f || !t || t < f){ alert('يرجى التحقق من التواريخ'); return; }
  S[k].push({ id: S.next++, pid: +$('fp').value, from: f, to: t, note: $('fn').value.trim() });
  render(); save();
};

window.delE = function(k, id){
  if(!OWN) return;
  S[k] = S[k].filter(e => e.id != id);
  render(); save();
};

function viewDuty(){
  var activeYr = yrOf(date);
  var yrDuty = (S.duty || []).filter(d => yrOf(d.date) === activeYr);
  var opts = S.people.map(p => `<option value="${p.id}">${esc(p.name)} (${ploc(p.id, date)})</option>`).join('');
  var list = yrDuty.slice().sort((a,b) => a.date < b.date ? 1 : -1).map(d => `
    <div class="worker-item">
      <div class="w-info">
        <div class="avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
        <div>
          <div class="w-name">${esc(pn(d.pid))} <span class="w-loc">${esc(ploc(d.pid, d.date))}</span></div>
          <div class="sub-txt" style="margin-top:3px">تاريخ المداومة: <b style="color:#7dd3fc">${esc(d.date)}</b> ${d.note ? '· ' + esc(d.note) : ''}</div>
        </div>
      </div>
      ${OWN
        ? `<button class="del-btn" onclick="delDuty(${d.id})">حذف</button>`
        : `<span class="st-pill duty">مداوم</span>`
      }
    </div>`).join('') || '<div style="color:var(--mu);font-size:13px;text-align:center;padding:14px">لا توجد مداومات مسجلة لسنة ' + activeYr + '</div>';

  return `
  <div class="glass-box list-wrap adm">
    <div class="list-title" style="margin-bottom:10px">تعيين موظف للمداومة</div>
    <label class="sub-txt">اختر الموظف المداوم</label>
    <select id="dp" class="form-inp">${opts}</select>
    <label class="sub-txt">تاريخ المداومة</label>
    <input type="date" id="dd" class="form-inp" value="${date}">
    <input id="dn" class="form-inp" placeholder="ملاحظة إضافية (اختياري: ليلية، نهاية الأسبوع...)">
    <button class="glow-btn" style="width:100%;justify-content:center" onclick="addDuty()">حفظ المداومة</button>
  </div>
  <div class="glass-box list-wrap">
    <div class="list-hdr" style="margin-bottom:10px">
      <div class="list-title" style="margin:0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>
        <span>جدول المداومة (${yrDuty.length})</span>
      </div>
      <div class="pill-input" style="width:auto;padding:4px 8px">
        <input type="date" value="${date}" onchange="setDate(this.value)">
      </div>
    </div>
    ${list}
  </div>`;
}

window.addDuty = function(){
  if(!OWN) return;
  var d = $('dd').value;
  if(!d){ alert('يرجى تحديد تاريخ المداومة'); return; }
  S.duty = S.duty || [];
  S.duty.push({ id: S.next++, pid: +$('dp').value, date: d, note: $('dn').value.trim() });
  render(); save();
};

window.delDuty = function(id){
  if(!OWN) return;
  S.duty = (S.duty || []).filter(x => x.id != id);
  render(); save();
};

function formatNoteDateTime(iso){
  try {
    var d = new Date(iso);
    if(isNaN(d.getTime())) return iso || '';
    var pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' · ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  } catch(x){ return iso || ''; }
}

function viewNotes(){
  var senderEmail = (CURRENT_USER && CURRENT_USER.email) ? CURRENT_USER.email : '';
  var formCard = `<div class="glass-box list-wrap">
    <div class="list-title" style="margin-bottom:10px">إرسال ملاحظة للمشرف</div>
    <p class="sub-txt" style="margin:0 0 8px">يمكنك كتابة ملاحظتك هنا وستُرسل مباشرة إلى المشرف باسم حسابك (${esc(senderEmail)}) ولا تظهر لباقي الزوار.</p>
    <textarea id="note-txt" class="form-inp" rows="3" placeholder="اكتب ملاحظتك هنا..."></textarea>
    <button class="glow-btn" style="width:100%;justify-content:center" onclick="sendNote()">إرسال الملاحظة</button>
    <div id="note-msg" class="sub-txt" style="margin-top:8px;text-align:center;color:#4ade80"></div>
  </div>`;

  if(!OWN){
    return formCard;
  }

  var unreadCount = getUnreadNotesCount();
  var notesList = (S.notes || []).slice().sort((a,b) => (a.createdAt < b.createdAt ? 1 : -1)).map(n => {
    var isUnread = !n.read;
    return `<div class="worker-item ${isUnread ? 'note-unread' : ''}" style="align-items:flex-start">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="w-name">${esc(n.author || 'زائر')}</span>
          ${isUnread ? '<span class="new-pill">جديد</span>' : ''}
          <span class="sub-txt">${esc(formatNoteDateTime(n.createdAt))}</span>
        </div>
        <div style="margin-top:5px;font-size:13px;line-height:1.5;color:#e2e8f0;white-space:pre-wrap">${esc(n.text)}</div>
      </div>
      <button class="del-btn" onclick="delNote(${n.id})">حذف</button>
    </div>`;
  }).join('') || '<div class="sub-txt" style="text-align:center;padding:14px">لا توجد ملاحظات واردة حالياً</div>';

  var clearBadgeBtn = unreadCount > 0
    ? `<button class="glow-btn sm" onclick="markAllNotesRead()">✓ تصفير العداد (${unreadCount})</button>`
    : '';

  return formCard + `<div class="glass-box list-wrap">
    <div class="list-hdr" style="margin-bottom:10px">
      <div class="list-title">الملاحظات الواردة (${(S.notes||[]).length})</div>
      ${clearBadgeBtn}
    </div>
    ${notesList}
  </div>`;
}

window.sendNote = function(){
  var txtInp = $('note-txt');
  var author = (CURRENT_USER && CURRENT_USER.email) ? CURRENT_USER.email : 'زائر';
  var text = txtInp ? txtInp.value.trim() : '';
  if(!text){ alert('يرجى كتابة نص الملاحظة أولاً'); return; }
  S.notes = S.notes || [];
  S.notes.push({
    id: S.next++,
    author: author,
    text: text,
    read: OWN ? true : false,
    createdAt: new Date().toISOString()
  });
  if(txtInp) txtInp.value = '';
  save().then(() => {
    if(OWN) render();
    var m = $('note-msg');
    if(m) m.textContent = 'تم إرسال ملاحظتك للمشرف بنجاح ✓';
  });
};

window.delNote = function(id){
  if(!OWN) return;
  S.notes = (S.notes || []).filter(n => n.id != id);
  render(); save();
};

function isPresentOrAuthorized(pid, d){
  if(isUnavailable(pid, d)) return false;
  var a = S.att[d] || {};
  return a[pid] === 'P';
}

function formatTimesAr(n){
  if(n === 1) return 'مرة واحدة';
  if(n === 2) return 'مرتين';
  if(n >= 3 && n <= 10) return n + ' مرات';
  return n + ' مرة';
}

function safeDays(a, b){
  if(!a || !b) return 0;
  var d = Math.round((new Date(b) - new Date(a)) / 864e5) + 1;
  return isNaN(d) || d < 0 ? 0 : d;
}


function viewStats(){
  var activeYr = yrOf(date);
  var activePeople = S.people
    .filter(p => isPresentOrAuthorized(p.id, date))
    .map(p => ({ p: p, asg: getAssign(p.id, date) }));

  var t1 = activePeople.filter(x => x.asg.loc === 'T1');
  var t2 = activePeople.filter(x => x.asg.loc === 'T2');
  var t3 = activePeople.filter(x => x.asg.loc === 'T3');

  function breakdown(arr, loc){
    return LOC_ZONES[loc].map(z => `${z}: <b>${arr.filter(x=>x.asg.sub===z).length}</b>`).join(' · ');
  }

  // تجميع إحصائيات العطل السنوية حسب الموظف للسنة المختارة
  var leavesByPid = {};
  (S.leave || []).filter(e => yrOf(e.from) === activeYr || yrOf(e.to) === activeYr).forEach(e => {
    var pid = e.pid;
    if(!leavesByPid[pid]) leavesByPid[pid] = [];
    leavesByPid[pid].push(safeDays(e.from, e.to));
  });

  var beneficiaryIds = Object.keys(leavesByPid);
  var leaveRowsHtml = beneficiaryIds.length
    ? beneficiaryIds.map(pid => {
        var durs = leavesByPid[pid];
        var dursText = durs.map(d => d + ' ' + (d === 1 ? 'يوم' : 'أيام')).join('، ');
        return `<div class="worker-item" style="margin-bottom:6px">
          <div class="w-info">
            <div class="avatar"><svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
            <div>
              <div class="w-name">${esc(pn(pid))}</div>
              <div class="sub-txt">استفاد ${formatTimesAr(durs.length)} · مدتها: <b style="color:#7dd3fc">${esc(dursText)}</b></div>
            </div>
          </div>
          <span class="st-pill leave">${durs.length}</span>
        </div>`;
      }).join('')
    : '<div class="sub-txt" style="text-align:center;padding:10px">لا يوجد مستفيدون من العطل السنوية لسنة ' + activeYr + '</div>';

  return `<div class="glass-box stats-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
      <div class="list-title" style="margin:0;font-size:14px">المتواجدون في أماكن العمل</div>
      <div class="pill-input" style="width:auto;padding:4px 8px">
        <input type="date" value="${date}" onchange="setDate(this.value)">
      </div>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(3, 1fr);margin-bottom:8px">
      <div class="stat-card g"><div class="stat-num">${t1.length}</div><div class="stat-lbl">مكان T1</div></div>
      <div class="stat-card o"><div class="stat-num">${t2.length}</div><div class="stat-lbl">مكان T2</div></div>
      <div class="stat-card p"><div class="stat-num">${t3.length}</div><div class="stat-lbl">مكان T3</div></div>
    </div>
    <div class="worker-item" style="flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:0">
      <div class="w-name" style="font-size:13px">تفاصيل T1: <span class="sub-txt">${breakdown(t1, 'T1')}</span></div>
      <div class="w-name" style="font-size:13px">تفاصيل T2: <span class="sub-txt">${breakdown(t2, 'T2')}</span></div>
      <div class="w-name" style="font-size:13px">تفاصيل T3: <span class="sub-txt">${breakdown(t3, 'T3')}</span></div>
    </div>
  </div>

  <div class="glass-box list-wrap">
    <div class="list-hdr" style="margin-bottom:8px">
      <div class="list-title" style="font-size:14px">إحصائيات العطل السنوية (${activeYr})</div>
      <span class="st-pill leave">المستفيدون: ${beneficiaryIds.length}</span>
    </div>
    ${leaveRowsHtml}
  </div>

  <div class="glass-box list-wrap adm" style="text-align:center">
    <div class="sub-txt" style="margin-bottom:8px">مسح كافة بيانات سنة <b>${activeYr}</b> (التعيينات، الحضور، الشواهد، العطل، الرخص والمداومات) وإعادتها إلى الصفر:</div>
    <button class="glow-btn danger" style="width:100%;justify-content:center;padding:9px" onclick="resetYearData()">إعادة الضبط</button>
  </div>`;
}

var _confirmResolver = null;
function showCustomConfirm(title, message, yesLabel){
  return new Promise(resolve => {
    _confirmResolver = resolve;
    $('confirm-title').textContent = title || 'تأكيد العملية';
    $('confirm-msg').textContent = message || '';
    $('confirm-yes-btn').textContent = yesLabel || 'نعم، متابعة';
    $('confirm-modal').style.display = 'grid';
  });
}
window.closeConfirmModal = function(result){
  var m = $('confirm-modal');
  if(m) m.style.display = 'none';
  if(_confirmResolver){
    var fn = _confirmResolver;
    _confirmResolver = null;
    fn(!!result);
  }
};

window.resetYearData = async function(){
  if(!OWN) return;
  var activeYr = yrOf(date);
  var ok = await showCustomConfirm('تأكيد إعادة الضبط', 'تحذير: سيتم مسح جميع بيانات سنة ' + activeYr + ' (تعيين أماكن العمل، الحضور، الشواهد المرضية، العطل السنوية، الرخص الإدارية والمداومات) وإعادة كل شيء إلى الصفر.\n\nهل أنت متأكد من المتابعة؟', 'نعم، مسح البيانات');
  if(!ok) return;

  // 1. مسح تعيينات أماكن العمل للسنة المحددة (يصبح الجميع "غير معين")
  S.assignByYear = S.assignByYear || {};
  S.assignByYear[activeYr] = {};
  if(activeYr === yrOf(td())){
    S.people.forEach(p => { p.loc = ''; p.sub = ''; });
  }

  // 2. مسح الحضور والغياب لجميع أيام هذه السنة
  Object.keys(S.att || {}).forEach(d => {
    if(yrOf(d) === activeYr) delete S.att[d];
  });

  // 3. مسح الشواهد المرضية، العطل السنوية، الرخص الإدارية والمداومات الخاصة بهذه السنة
  ['sick', 'leave', 'exc'].forEach(k => {
    S[k] = (S[k] || []).filter(e => yrOf(e.from) !== activeYr && yrOf(e.to) !== activeYr);
  });
  S.duty = (S.duty || []).filter(d => yrOf(d.date) !== activeYr);

  render();
  save();
};

function renderAuth(){
  if(!LOGGED_IN) return;
  var emailTxt = (CURRENT_USER && CURRENT_USER.email) ? CURRENT_USER.email : '';
  var roleBadge = OWN
    ? `<span class="role-tag admin">مشرف</span>`
    : `<span class="role-tag visitor">زائر</span>`;

  var onlineBtn = OWN
    ? `<button class="online-pill" onclick="openOnlineModal()" title="عرض المتصلين الآن"><span class="online-dot"></span><span>متصل الآن (${ONLINE_USERS.length})</span></button>`
    : '';

  $('hdr-auth').innerHTML = `
    <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end">
      ${onlineBtn}
      <button class="glow-btn sm danger" onclick="doLogout()">خروج</button>
    </div>
    <div style="display:flex;align-items:center;gap:5px">
      ${roleBadge}
      <span class="user-badge" title="${esc(emailTxt)}">${esc(emailTxt)}</span>
    </div>
  `;
}


// =========================================================
// Feature 6: Unread Notes Counter & Mark All Read
// =========================================================
function getUnreadNotesCount(){
  return (S.notes || []).filter(n => !n.read).length;
}
window.markAllNotesRead = function(){
  if(!OWN) return;
  (S.notes || []).forEach(n => { n.read = true; });
  render();
  save();
};

// =========================================================
// Feature 3: Smart Leave / Sick Return Alerts Banner
// =========================================================
function addDaysStr(dateStr, delta){
  var parts = String(dateStr).split('-').map(Number);
  var dt = new Date(parts[0], parts[1] - 1, parts[2] + delta);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}

function renderSmartAlerts(){
  if(!OWN) return '';
  var tomorrowStr = addDaysStr(date, 1);
  var alerts = [];
  ['sick', 'leave', 'exc'].forEach(k => {
    (S[k] || []).forEach(e => {
      if(e.to === date){
        alerts.push(`تنتهي <b>${CFG[k].lb}</b> للموظف <b>${esc(pn(e.pid))}</b> اليوم (${esc(date)}) ويعود للعمل غداً (${esc(ploc(e.pid, tomorrowStr))}).`);
      } else if(e.to === tomorrowStr){
        alerts.push(`تنتهي <b>${CFG[k].lb}</b> للموظف <b>${esc(pn(e.pid))}</b> غداً (${esc(tomorrowStr)}) ويعود للعمل بعد غد.`);
      } else if(addDaysStr(e.to, 1) === date){
        alerts.push(`عاد الموظف <b>${esc(pn(e.pid))}</b> اليوم للعمل في <b>${esc(ploc(e.pid, date))}</b> بعد انتهاء <b>${CFG[k].lb}</b>.`);
      }
    });
  });
  if(!alerts.length) return '';
  return `<div class="alert-banner">
    <div class="alert-hdr">
      <span>🔔 تنبيهات العودة وانتهاء الرخص (${alerts.length})</span>
      <span style="font-size:10px;opacity:0.85">${esc(date)}</span>
    </div>
    ${alerts.map(a => `<div class="alert-item">• ${a}</div>`).join('')}
  </div>`;
}

// =========================================================
// Feature 2: Employee Full Profile Modal
// =========================================================
window.openProfileModal = function(pid){
  var p = S.people.find(x => x.id == pid);
  if(!p) return;
  var activeYr = yrOf(date);
  var asg = getAssign(pid, date);

  var presentDays = 0, absentDays = 0;
  Object.keys(S.att || {}).forEach(d => {
    if(yrOf(d) === activeYr && S.att[d]){
      if(S.att[d][pid] === 'P') presentDays++;
      else if(S.att[d][pid] === 'A') absentDays++;
    }
  });

  var yrSick = (S.sick || []).filter(e => e.pid == pid && (yrOf(e.from) === activeYr || yrOf(e.to) === activeYr));
  var yrLeave = (S.leave || []).filter(e => e.pid == pid && (yrOf(e.from) === activeYr || yrOf(e.to) === activeYr));
  var yrExc = (S.exc || []).filter(e => e.pid == pid && (yrOf(e.from) === activeYr || yrOf(e.to) === activeYr));
  var yrDuty = (S.duty || []).filter(d => d.pid == pid && yrOf(d.date) === activeYr);

  var sickTotalDays = yrSick.reduce((acc, e) => acc + safeDays(e.from, e.to), 0);
  var leaveTotalDays = yrLeave.reduce((acc, e) => acc + safeDays(e.from, e.to), 0);
  var excTotalDays = yrExc.reduce((acc, e) => acc + safeDays(e.from, e.to), 0);

  $('prof-title').innerHTML = `${esc(p.name)} <span class="w-loc" style="margin-right:6px">${esc(asg.loc ? (asg.loc + ' · ' + asg.sub) : 'غير معين')}</span>`;

  var recordsHtml = '';
  yrLeave.forEach(e => {
    recordsHtml += `<div class="worker-item" style="margin-bottom:5px;padding:7px 10px">
      <div><span class="st-pill leave" style="font-size:10px;padding:2px 8px">عطلة سنوية</span> <span class="sub-txt">${esc(e.from)} ← ${esc(e.to)} (${safeDays(e.from, e.to)} يوم)</span></div>
    </div>`;
  });
  yrSick.forEach(e => {
    recordsHtml += `<div class="worker-item" style="margin-bottom:5px;padding:7px 10px">
      <div><span class="st-pill sick" style="font-size:10px;padding:2px 8px">شهادة مرضية</span> <span class="sub-txt">${esc(e.from)} ← ${esc(e.to)} (${safeDays(e.from, e.to)} يوم) ${e.note ? '· ' + esc(e.note) : ''}</span></div>
    </div>`;
  });
  yrExc.forEach(e => {
    recordsHtml += `<div class="worker-item" style="margin-bottom:5px;padding:7px 10px">
      <div><span class="st-pill exc" style="font-size:10px;padding:2px 8px">رخصة إدارية</span> <span class="sub-txt">${esc(e.from)} ← ${esc(e.to)} (${safeDays(e.from, e.to)} يوم) ${e.note ? '· ' + esc(e.note) : ''}</span></div>
    </div>`;
  });
  yrDuty.forEach(d => {
    recordsHtml += `<div class="worker-item" style="margin-bottom:5px;padding:7px 10px">
      <div><span class="st-pill duty" style="font-size:10px;padding:2px 8px">مداومة</span> <span class="sub-txt">${esc(d.date)} ${d.note ? '· ' + esc(d.note) : ''}</span></div>
    </div>`;
  });

  $('prof-body').innerHTML = `
    <div class="sub-txt" style="margin-bottom:8px">ملخص سجل الموظف لسنة <b style="color:#7dd3fc">${activeYr}</b>:</div>
    <div class="prof-grid">
      <div class="prof-stat"><b style="color:#4ade80">${presentDays}</b><span>أيام الحضور</span></div>
      <div class="prof-stat"><b style="color:#f87171">${absentDays}</b><span>أيام الغياب</span></div>
      <div class="prof-stat"><b style="color:#38bdf8">${yrDuty.length}</b><span>عدد المداومات</span></div>
      <div class="prof-stat"><b style="color:#60a5fa">${leaveTotalDays}</b><span>أيام العطلة</span></div>
      <div class="prof-stat"><b style="color:#fca5a5">${sickTotalDays}</b><span>أيام المرض</span></div>
      <div class="prof-stat"><b style="color:#c4b5fd">${excTotalDays}</b><span>رخص إدارية</span></div>
    </div>
    <div class="prof-sec-title">السجل التفصيلي للعطل والرخص والمداومات</div>
    ${recordsHtml || '<div class="sub-txt" style="text-align:center;padding:10px">لا توجد عطل أو رخص أو مداومات مسجلة لهذه السنة</div>'}
  `;
  $('profile-modal').style.display = 'grid';
};

window.closeProfileModal = function(){
  var m = $('profile-modal');
  if(m) m.style.display = 'none';
};

// =========================================================
// Feature 4: Quick Swap Modal (Work Location / Duty)
// =========================================================
window.openSwapModal = function(mode){
  if(!OWN) return;
  $('sw-type').value = mode || 'loc';
  var opts = S.people.map(p => `<option value="${p.id}">${esc(p.name)} (${ploc(p.id, date)})</option>`).join('');
  $('sw-p1').innerHTML = opts;
  $('sw-p2').innerHTML = opts;
  if(S.people.length > 1) $('sw-p2').selectedIndex = 1;

  var activeYr = yrOf(date);
  var yrDuty = (S.duty || []).filter(d => yrOf(d.date) === activeYr).slice().sort((a,b) => a.date < b.date ? 1 : -1);
  $('sw-duty-id').innerHTML = yrDuty.length
    ? yrDuty.map(d => `<option value="${d.id}">${esc(pn(d.pid))} — ${esc(d.date)} ${d.note ? '('+esc(d.note)+')' : ''}</option>`).join('')
    : '<option value="">لا توجد مداومات مسجلة</option>';
  $('sw-duty-newpid').innerHTML = opts;

  toggleSwapMode();
  $('swap-modal').style.display = 'grid';
};

window.closeSwapModal = function(){
  var m = $('swap-modal');
  if(m) m.style.display = 'none';
};

window.toggleSwapMode = function(){
  var mode = $('sw-type').value;
  $('sw-loc-box').style.display = (mode === 'loc') ? 'block' : 'none';
  $('sw-duty-box').style.display = (mode === 'duty') ? 'block' : 'none';
};

window.executeSwap = function(){
  if(!OWN) return;
  var mode = $('sw-type').value;
  if(mode === 'loc'){
    var p1 = +$('sw-p1').value;
    var p2 = +$('sw-p2').value;
    if(p1 === p2){ alert('يرجى اختيار موظفين مختلفين'); return; }
    var a1 = getAssign(p1, date);
    var a2 = getAssign(p2, date);
    setAssign(p1, date, a2.loc, a2.sub);
    setAssign(p2, date, a1.loc, a1.sub);
  } else {
    var did = +$('sw-duty-id').value;
    var newPid = +$('sw-duty-newpid').value;
    if(!did){ alert('لا توجد مداومة محددة للتبديل'); return; }
    var dutyRec = (S.duty || []).find(d => d.id == did);
    if(!dutyRec) return;
    if(dutyRec.pid === newPid){ alert('هذا الموظف معيّن بالفعل لهذه المداومة'); return; }
    var oldName = pn(dutyRec.pid);
    dutyRec.pid = newPid;
    dutyRec.note = (dutyRec.note ? dutyRec.note + ' · ' : '') + 'تعويض عن ' + oldName;
  }
  closeSwapModal();
  render();
  save();
};

render();
</script>
</body>
</html>
